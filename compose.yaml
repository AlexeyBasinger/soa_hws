services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./src/openapi/openapi.yaml:/spec/openapi.yaml:ro

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10
    depends_on:
      - db
    command: >
      -url=jdbc:postgresql://db:5432/marketplace
      -user=marketplace
      -password=marketplace
      -connectRetries=60
      migrate
    volumes:
      - ./src/db/migrations:/flyway/sql:ro

  api:
    build: .
    depends_on:
      - db
      - flyway
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace
      JWT_SECRET: "dev-secret-change-me"
      ACCESS_TTL_MINUTES: "20"
      REFRESH_TTL_DAYS: "14"
    ports:
      - "8080:8080"

volumes:
  pgdata:
